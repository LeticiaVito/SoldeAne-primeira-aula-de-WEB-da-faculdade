<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Produto</title>

    <style>

        body{
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: #f5f0ea;
        }

        .logo{
            width: 110px;
            margin-bottom: 15px;
        }

        .card{
            width: 400px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .slider{
            position: relative;
        }

        #foto{
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        button{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            cursor: pointer;
        }

        .esquerda{ left: 10px; }
        .direita{ right: 10px; }

        .info{
            padding: 20px;
            text-align: center;
        }

        h1{
            color: #6b4328;
        }

        p{
            color: #666;
        }

    </style>

</head>

<body>

    <img src="img/logocomfundo.png" class="logo">

    <div class="card">

        <div class="slider">

            <button class="esquerda" onclick="voltar()">❮</button>

            <img id="foto" src="img/bolo2.jpg">

            <button class="direita" onclick="proximo()">❯</button>

        </div>

        <div class="info">

            <h1 id="nome">Bolo Red Velvet</h1>

            <p id="desc">Bolo com morangos frescos.</p>

        </div>

    </div>

    <script>


let produto = "red";


function proximo(){

    if(produto == "red"){

        foto.src = "img/bolo4.jpg";

        nome.innerHTML = "Bolo de brigadeiro";

        desc.innerHTML = "Bolo de chocolate super fofinho com recheio cremoso de brigadeiro e cobertura generosa feita com chocolate ao leite.";

        produto = "brigadeiro";
    }

    else if(produto == "brigadeiro"){

        foto.src = "img/bolo8.jpg";

        nome.innerHTML = "Bolo de chocolate com maracujá";

        desc.innerHTML = "Delicioso bolo de chocolate com recheio cremoso de maracujá, trazendo o equilíbrio perfeito entre doce e cítrico.";

        produto = "maracuja";
    }

    else if(produto == "maracuja"){

        foto.src = "img/bolo7.jpg";

        nome.innerHTML = "Bolo de red com morangos";

        desc.innerHTML = "Massa red velvet macia com cobertura de chocolate branco e morangos frescos selecionados para deixar tudo ainda mais especial.";

        produto = "especial";
    }

    else{

        foto.src = "img/bolo2.jpg";

        nome.innerHTML = "Bolo Red Velvet com morangos";

        desc.innerHTML = "Bolo red velvet extremamente fofinho, recheado com creme especial e finalizado com morangos frescos e cobertura cremosa.";

        produto = "red";
    }

}


function voltar(){

    if(produto == "red"){

        foto.src = "img/bolo7.jpg";

        nome.innerHTML = "Bolo de red com morangos";

        desc.innerHTML = "Massa red velvet macia com cobertura de chocolate branco e morangos frescos selecionados para deixar tudo ainda mais especial.";

        produto = "especial";
    }

    else if(produto == "especial"){

        foto.src = "img/bolo8.jpg";

        nome.innerHTML = "Bolo de chocolate com maracujá";

        desc.innerHTML = "Delicioso bolo de chocolate com recheio cremoso de maracujá, trazendo o equilíbrio perfeito entre doce e cítrico.";

        produto = "maracuja";
    }

    else if(produto == "maracuja"){

        foto.src = "img/bolo4.jpg";

        nome.innerHTML = "Bolo de brigadeiro";

        desc.innerHTML = "Bolo de chocolate super fofinho com recheio cremoso de brigadeiro e cobertura generosa feita com chocolate ao leite.";

        produto = "brigadeiro";
    }

    else{

        foto.src = "img/bolo2.jpg";

        nome.innerHTML = "Bolo Red Velvet com morangos";

        desc.innerHTML = "Bolo red velvet extremamente fofinho, recheado com creme especial e finalizado com morangos frescos e cobertura cremosa.";

        produto = "red";
    }

}
    </script>

</body>
</html>
